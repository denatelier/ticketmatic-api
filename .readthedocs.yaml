# Read the Docs configuration file.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  # A single cosmetic warning is emitted for the ambiguous ``type`` name; do
  # not fail the build on it. Flip to true once the build is warning-free.
  fail_on_warning: false

# Install the package (with its ``docs`` extra: sphinx + furo) so autodoc can
# import ``ticketmatic``.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
