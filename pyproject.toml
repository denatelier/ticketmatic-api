[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticketmatic"
version = "1.0.0"
description = "Python API client for the Ticketmatic API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "black>=26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ticketmatic"]

[tool.black]
target-version = ["py311", "py312", "py313"]
