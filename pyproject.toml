[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticketmatic-api"
version = "1.0.0"
description = "Python API client for the Ticketmatic API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "black>=26.0",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ticketmatic"]

[tool.black]
target-version = ["py311", "py312", "py313"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
