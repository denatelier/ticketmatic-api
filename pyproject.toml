[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticketmatic-api"
version = "1.0.1"
description = "Python API client for the Ticketmatic API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yves Thommes" },
]
keywords = ["ticketmatic", "ticketing", "api", "client", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/denatelier/ticketmatic-api"
Repository = "https://github.com/denatelier/ticketmatic-api"
Issues = "https://github.com/denatelier/ticketmatic-api/issues"
Changelog = "https://github.com/denatelier/ticketmatic-api/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "black>=26.0",
    "ruff>=0.15",
]
docs = [
    "sphinx>=7.3",
    "furo>=2024.5.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ticketmatic"]

[tool.hatch.build.targets.sdist]
# Keep repo tooling out of the source distribution.
exclude = [".github", ".idea", ".claude", ".readthedocs.yaml", ".venv"]

[tool.black]
target-version = ["py311", "py312", "py313"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
